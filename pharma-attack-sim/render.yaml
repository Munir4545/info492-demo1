services:
  # Backend API Server
  - type: web
    name: pharma-attack-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: OPENROUTER_API_KEY
        sync: false  # You'll add this in Render dashboard
    healthCheckPath: /api/config

  # Frontend Static Site
  - type: web
    name: pharma-attack-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://pharma-attack-backend.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

