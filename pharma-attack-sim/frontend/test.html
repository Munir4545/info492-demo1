<!DOCTYPE html>
<html>
<head>
    <title>Connection Test</title>
</head>
<body>
    <h1>Pharma Attack Sim - Connection Test</h1>
    <div id="status">Testing...</div>
    <script>
        async function test() {
            const status = document.getElementById('status');
            try {
                // Test backend
                const backendTest = await fetch('http://localhost:3001/api/config');
                const backendData = await backendTest.json();
                status.innerHTML += `<p>Backend: ${backendTest.ok ? '✅ Connected' : '❌ Error: ' + JSON.stringify(backendData)}</p>`;
                
                // Test Socket.IO
                const script = document.createElement('script');
                script.src = 'https://cdn.socket.io/4.6.1/socket.io.min.js';
                script.onload = () => {
                    const socket = io('http://localhost:3001');
                    socket.on('connect', () => {
                        status.innerHTML += '<p>WebSocket: ✅ Connected</p>';
                        socket.disconnect();
                    });
                    socket.on('connect_error', (err) => {
                        status.innerHTML += `<p>WebSocket: ❌ Error - ${err.message}</p>`;
                    });
                };
                document.head.appendChild(script);
                
            } catch (error) {
                status.innerHTML += `<p>❌ Error: ${error.message}</p>`;
            }
        }
        test();
    </script>
</body>
</html>
